<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2Ray GeoLab</title>
    <style>
        :root {
            --color-bg: #0d1117;
            --color-card: #161b22;
            --color-border: #30363d;
            --color-fg-default: #c9d1d9;
            --color-fg-muted: #6e7681;
            --color-blue: #58a6ff;
            --color-line-nums: #484f58;
            --color-btn-bg: #21262d;
            --color-btn-red: #da3633;
        }

        html, body { min-height: 100%; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            background-color: var(--color-bg); color: var(--color-fg-default); 
            display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; 
        }

        .pda-link {
            display: inline-block; margin-bottom: 15px; align-self: flex-start;
            background: var(--color-btn-bg); border: 1px solid var(--color-border);
            color: var(--color-fg-default); padding: 6px 12px; border-radius: 6px;
            text-decoration: none; font-size: 13px; font-weight: 600;
        }

        .lang-panel { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
        .lang-btn { background: transparent; border: 2px solid transparent; cursor: pointer; border-radius: 4px; padding: 2px; }
        .lang-btn img { width: 24px; border-radius: 2px; }
        .lang-btn.active { border-color: var(--color-blue); }

        h2 { color: #f0f6fc; font-size: 22px; text-align: center; margin: 10px 0 20px 0; }
        
        .container { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        
        .column { 
            display: flex; flex-direction: column; 
            background: var(--color-card); border-radius: 6px; 
            border: 1px solid var(--color-border); overflow: hidden;
            height: 350px; flex: none; 
        }

        .col-header { padding: 10px 15px; background-color: #161b22; border-bottom: 1px solid var(--color-border); flex-shrink: 0; }
        .col-header h3 { margin: 0; font-size: 11px; color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: 1px; }

        .editor-wrapper { display: flex; flex: 1; background-color: var(--color-bg); overflow: hidden; }

        .line-numbers {
            width: 35px; padding: 12px 0; text-align: center;
            background: var(--color-card); color: var(--color-line-nums);
            border-right: 1px solid var(--color-border); user-select: none;
            font-family: monospace; font-size: 12px; line-height: 20px; overflow: hidden;
        }

        textarea { 
            flex: 1; border: none; padding: 12px; background: transparent; color: var(--color-fg-default); 
            font-family: monospace; font-size: 12px; line-height: 20px; 
            resize: none; outline: none; overflow: auto; white-space: pre;
        }

        .search-box { padding: 10px 15px; background: var(--color-card); border-bottom: 1px solid var(--color-border); flex-shrink: 0; }
        .search-input {
            width: 100%; background: var(--color-bg); border: 1px solid var(--color-border);
            color: var(--color-fg-default); border-radius: 6px; padding: 6px 12px; font-size: 13px; box-sizing: border-box;
        }

        .col-footer { padding: 12px; background-color: var(--color-card); border-top: 1px solid var(--color-border); display: grid; gap: 8px; flex-shrink: 0; }
        .dual-button { grid-template-columns: 1fr 1fr; }
        .quad-button { grid-template-columns: 1fr 1fr; } 

        .btn-vmerge {
            background-color: var(--color-btn-bg); color: var(--color-fg-muted);
            border: 1px solid var(--color-border); border-radius: 6px;
            padding: 10px 4px; font-size: 11px; font-weight: 600; cursor: pointer;
            transition: 0.2s; opacity: 0.5; text-align: center;
            display: flex; align-items: center; justify-content: center; line-height: 1.2;
        }
        .btn-vmerge.active { opacity: 1; color: var(--color-fg-default); }
        .btn-main-run.active { background-color: #238636; color: white; }
        .btn-red.active:hover { background-color: var(--color-btn-red); color: white; }
        .btn-orange.active { background-color: #af5700; color: white; }
        .btn-blue.active { background-color: #1f6feb; color: white; }

        #status { padding: 8px 15px; font-size: 12px; color: var(--color-fg-muted); background: var(--color-card); border-top: 1px solid var(--color-border); flex-shrink: 0; }

        @media (min-width: 992px) {
            body { overflow: hidden; height: 100vh; padding: 25px; }
            h2 { font-size: 28px; margin-bottom: 25px; }
            .container { flex-direction: row; height: 75vh; align-items: stretch; }
            .column { height: auto; flex: 1; }
            .col-input { flex: 2; }
            .col-geo { flex: 0.7; min-width: 160px; }
            .col-output { flex: 2.2; }
            .quad-button { grid-template-columns: 1fr 1.3fr 1.3fr 1fr; }
            .pda-link { position: absolute; top: 32px; left: 25px; margin: 0; }
            .lang-panel { top: 32px; right: 25px; }
        }
    </style>
</head>
<body>

    <a href="https://4pda.to/forum/index.php?showuser=8370973" target="_blank" class="pda-link">4PDA</a>

    <div class="lang-panel">
        <button class="lang-btn active" onclick="setLang('ru')" id="btn-ru"><img src="https://flagpedia.net/data/flags/h80/ru.png"></button>
        <button class="lang-btn" onclick="setLang('en')" id="btn-en"><img src="https://flagpedia.net/data/flags/h80/gb.png"></button>
    </div>

    <h2 id="main-title">V2Ray GeoLab</h2>

    <div class="container">
        <div class="column col-input">
            <div class="col-header"><h3 id="label-input">Ввод ссылок</h3></div>
            <div class="editor-wrapper">
                <div id="inputLineNums" class="line-numbers">1</div>
                <textarea id="inputLinks" oninput="onInputLinks()" onscroll="syncScroll('input')"></textarea>
            </div>
            <div class="col-footer dual-button">
                <button id="runBtn" class="btn-vmerge btn-main-run" onclick="processLinks()" disabled>Запустить</button>
                <button id="clrInputBtn" class="btn-vmerge btn-red" onclick="clearInput()" disabled><span id="text-clear-input">Очистить</span></button>
            </div>
            <div id="status">> <span id="statusText">Готов к работе</span></div>
        </div>

        <div class="column col-geo">
            <div class="col-header"><h3 id="label-geo">Страна</h3></div>
            <div class="editor-wrapper">
                <div id="geoLineNums" class="line-numbers">1</div>
                <textarea id="geoList" readonly onscroll="syncScroll('geo')"></textarea>
            </div>
            <div class="col-footer" style="min-height: 38px;"></div>
        </div>

        <div class="column col-output">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" oninput="filterResults()">
            </div>
            <div class="editor-wrapper">
                <div id="outputLineNums" class="line-numbers">1</div>
                <textarea id="outputLinks" readonly onscroll="syncScroll('output')"></textarea>
            </div>
            <div class="col-footer quad-button">
                <button class="btn-vmerge" id="btn-copy" onclick="copyOutput()" disabled><span id="text-copy">Копировать</span></button>
                <button class="btn-vmerge btn-orange" id="btn-retry" onclick="retryUnknown()" disabled><span id="text-retry">Пересканировать неизвестные</span></button>
                <button class="btn-vmerge btn-blue" id="btn-dl" onclick="downloadTxt()" disabled><span id="text-download">Скачать TXT</span></button>
                <button class="btn-vmerge btn-red" id="btn-clr" onclick="clearOutput()" disabled><span id="text-clear">Очистить</span></button>
            </div>
        </div>
    </div>

<script>
    const i18n = {
        ru: { 
            title: "V2Ray GeoLab", labelInput: "Ввод ссылок", labelGeo: "Страна",
            placeholderInput: "Вставьте ссылки...", placeholderSearch: "Поиск...",
            runBtn: "Запустить", processing: "Обработка...", separator: "--- НЕИЗВЕСТНО ---",
            copy: "Копировать", download: "Скачать TXT", clear: "Очистить", 
            clearInput: "Очистить", retry: "Пересканировать неизвестные", copied: "Скопировано!", 
            done: "Готово!", ready: "Готов к работе", unknown: "Неизвестно"
        },
        en: { 
            title: "V2Ray GeoLab", labelInput: "Input Links", labelGeo: "Country",
            placeholderInput: "Paste links...", placeholderSearch: "Search...",
            runBtn: "Run", processing: "Processing...", separator: "--- UNKNOWN ---",
            copy: "Copy", download: "Download TXT", clear: "Clear", 
            clearInput: "Clear Input", retry: "Rescan Unknown", copied: "Copied!", 
            done: "Done!", ready: "Ready", unknown: "Unknown"
        }
    };

    let currentLang = 'ru';
    let fullResults = []; 
    let isProcessing = false;

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
        
        document.getElementById('main-title').innerText = i18n[lang].title;
        document.getElementById('label-input').innerText = i18n[lang].labelInput;
        document.getElementById('label-geo').innerText = i18n[lang].labelGeo;
        document.getElementById('inputLinks').placeholder = i18n[lang].placeholderInput;
        document.getElementById('searchInput').placeholder = i18n[lang].placeholderSearch;
        
        const runBtn = document.getElementById('runBtn');
        runBtn.innerText = isProcessing ? i18n[lang].processing : i18n[lang].runBtn;
        
        document.getElementById('text-clear-input').innerText = i18n[lang].clearInput;
        document.getElementById('text-copy').innerText = i18n[lang].copy;
        document.getElementById('text-retry').innerText = i18n[lang].retry;
        document.getElementById('text-download').innerText = i18n[lang].download;
        document.getElementById('text-clear').innerText = i18n[lang].clear;
        
        if (!isProcessing) {
            document.getElementById('statusText').innerText = i18n[lang].ready;
        }
        
        renderResults(fullResults);
    }

    function syncScroll(type) {
        let scrollVal = 0;
        if (type === 'input') {
            scrollVal = document.getElementById('inputLinks').scrollTop;
            document.getElementById('inputLineNums').scrollTop = scrollVal;
        } else if (type === 'geo') {
            scrollVal = document.getElementById('geoList').scrollTop;
            document.getElementById('geoLineNums').scrollTop = scrollVal;
        } else if (type === 'output') {
            scrollVal = document.getElementById('outputLinks').scrollTop;
            document.getElementById('outputLineNums').scrollTop = scrollVal;
        }
    }

    function updateLineNumbers(type) {
        let areaId, numsId;
        if (type === 'input') { areaId = 'inputLinks'; numsId = 'inputLineNums'; }
        else if (type === 'geo') { areaId = 'geoList'; numsId = 'geoLineNums'; }
        else { areaId = 'outputLinks'; numsId = 'outputLineNums'; }

        const area = document.getElementById(areaId);
        const nums = document.getElementById(numsId);
        if (!nums || !area) return;
        const lines = area.value.split('\n').length;
        nums.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
    }

    function onInputLinks() {
        updateLineNumbers('input');
        const hasText = document.getElementById('inputLinks').value.trim().length > 0;
        document.getElementById('runBtn').disabled = !hasText || isProcessing;
        document.getElementById('runBtn').classList.toggle('active', hasText && !isProcessing);
        document.getElementById('clrInputBtn').disabled = !hasText || isProcessing;
        document.getElementById('clrInputBtn').classList.toggle('active', hasText && !isProcessing);
    }

    function clearInput() { document.getElementById('inputLinks').value = ""; onInputLinks(); }

    function getIP(link) {
        try {
            let base = link.split('#')[0].trim();
            if (base.startsWith('vmess://')) {
                const json = JSON.parse(atob(base.replace('vmess://', '')));
                return json.add;
            } else {
                const urlPart = base.split('://')[1];
                const hostPart = urlPart.split('@')[1] || urlPart;
                return hostPart.split(':')[0].split('?')[0].split('/')[0];
            }
        } catch (e) { return null; }
    }

    async function fetchCountry(ip) {
        if (!ip || ip === '127.0.0.1') return "Unknown";
        try {
            const response = await fetch(`http://ip-api.com/json/${ip}?fields=status,country`);
            const data = await response.json();
            return (data.status === 'success' && data.country) ? data.country : "Unknown";
        } catch (e) { return "Unknown"; }
    }

    async function processLinks() {
        const lines = document.getElementById('inputLinks').value.split('\n').filter(l => l.trim() !== "");
        if (lines.length === 0) return;
        isProcessing = true;
        onInputLinks();
        fullResults = [];
        const status = document.getElementById('statusText');
        for (let i = 0; i < lines.length; i++) {
            status.innerText = `${i18n[currentLang].processing} ${i+1}/${lines.length}`;
            const ip = getIP(lines[i]);
            const country = await fetchCountry(ip);
            fullResults.push({ base: lines[i].split('#')[0], country: country });
            renderResults(fullResults);
            await new Promise(r => setTimeout(r, 150));
        }
        status.innerText = i18n[currentLang].done;
        isProcessing = false;
        onInputLinks();
        updateButtonState();
    }

    async function retryUnknown() {
        const unknowns = fullResults.filter(r => r.country === "Unknown");
        if (unknowns.length === 0) return;
        isProcessing = true;
        updateButtonState();
        const status = document.getElementById('statusText');
        for (let i = 0; i < unknowns.length; i++) {
            status.innerText = `${i18n[currentLang].processing} ${i+1}/${unknowns.length}`;
            const ip = getIP(unknowns[i].base);
            const country = await fetchCountry(ip);
            if (country !== "Unknown") unknowns[i].country = country;
            renderResults(fullResults);
            await new Promise(r => setTimeout(r, 200));
        }
        status.innerText = i18n[currentLang].done;
        isProcessing = false;
        updateButtonState();
    }

    function renderResults(arr) {
        const query = document.getElementById('searchInput').value.toLowerCase();
        let filtered = arr.filter(item => 
            item.base.toLowerCase().includes(query) || 
            item.country.toLowerCase().includes(query)
        );
        
        const known = filtered.filter(r => r.country !== "Unknown");
        const unknown = filtered.filter(r => r.country === "Unknown");
        
        const sep = i18n[currentLang].separator;
        const unknownText = i18n[currentLang].unknown;
        
        let linksOutput = "";
        let geoOutput = "";
        
        if (known.length > 0 && unknown.length > 0) {
            linksOutput = known.map(r => `${r.base}#${r.country}`).join('\n') + 
                          '\n' + sep + '\n' + 
                          unknown.map(r => `${r.base}#${unknownText}`).join('\n');
            geoOutput = known.map(r => r.country).join('\n') + 
                        '\n' + sep + '\n' + 
                        unknown.map(() => unknownText).join('\n');
        } else {
            const all = [...known, ...unknown];
            linksOutput = all.map(r => `${r.base}#${r.country === "Unknown" ? unknownText : r.country}`).join('\n');
            geoOutput = all.map(r => r.country === "Unknown" ? unknownText : r.country).join('\n');
        }
        
        document.getElementById('outputLinks').value = linksOutput;
        document.getElementById('geoList').value = geoOutput;
        
        updateLineNumbers('output');
        updateLineNumbers('geo');
        updateButtonState();
    }

    function updateButtonState() {
        const hasText = document.getElementById('outputLinks').value.trim().length > 0;
        const hasUnknown = fullResults.some(r => r.country === "Unknown");
        ['btn-copy', 'btn-dl', 'btn-clr'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.disabled = !hasText || isProcessing;
                el.classList.toggle('active', hasText && !isProcessing);
            }
        });
        const rb = document.getElementById('btn-retry');
        if (rb) {
            rb.disabled = !hasUnknown || isProcessing;
            rb.classList.toggle('active', hasUnknown && !isProcessing);
        }
    }

    function filterResults() { renderResults(fullResults); }
    function clearOutput() { fullResults = []; renderResults([]); }

    function copyOutput() {
        const outputArea = document.getElementById('outputLinks');
        const sepRu = i18n.ru.separator;
        const sepEn = i18n.en.separator;

        const textToCopy = outputArea.value.split('\n')
            .filter(line => {
                const t = line.trim();
                return t !== "" && t !== sepRu && t !== sepEn;
            })
            .join('\n');

        if (!textToCopy) return;

        const showFeedback = () => {
            const el = document.getElementById('text-copy');
            const old = el.innerText;
            el.innerText = i18n[currentLang].copied;
            setTimeout(() => el.innerText = old, 2000);
        };

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy)
                .then(showFeedback)
                .catch(() => fallbackCopy(textToCopy, showFeedback));
        } else {
            fallbackCopy(textToCopy, showFeedback);
        }
    }

    function fallbackCopy(text, callback) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed"; 
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            const successful = document.execCommand('copy');
            if (successful && callback) callback();
        } catch (err) {
            console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textArea);
    }

    function downloadTxt() {
        const sepRu = i18n.ru.separator;
        const sepEn = i18n.en.separator;
        const text = document.getElementById('outputLinks').value.split('\n')
            .filter(line => {
                const t = line.trim();
                return t !== "" && t !== sepRu && t !== sepEn;
            })
            .join('\n');
        const blob = new Blob([text], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "configs.txt";
        a.click();
    }

    setLang('ru');
</script>
</body>
</html>
