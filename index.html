<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2Ray GeoLab Pro</title>
    <style>
        :root {
            --color-bg: #0d1117;
            --color-card: #161b22;
            --color-border: #30363d;
            --color-fg-default: #c9d1d9;
            --color-fg-muted: #6e7681;
            --color-accent: #238636;
            --color-blue: #58a6ff;
            --color-line-nums: #484f58;
            --color-btn-bg: #21262d;
            --color-btn-blue: #1f6feb;
            --color-btn-red: #da3633;
        }

        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            background-color: var(--color-bg); color: var(--color-fg-default); 
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; 
        }

        .lang-panel { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; z-index: 100; }
        .lang-btn { background: transparent; border: 2px solid transparent; padding: 2px; cursor: pointer; border-radius: 4px; opacity: 0.6; transition: 0.2s; }
        .lang-btn img { width: 24px; display: block; }
        .lang-btn.active { border-color: var(--color-blue); opacity: 1; }

        h2 { color: #f0f6fc; font-size: 24px; margin: 0 0 20px 0; text-align: center; flex-shrink: 0; }
        
        .container { display: flex; gap: 15px; max-width: 1600px; margin: 0 auto; width: 100%; flex-grow: 1; min-height: 0; }
        
        .column { flex: 1; display: flex; flex-direction: column; background: var(--color-card); border-radius: 6px; border: 1px solid var(--color-border); overflow: hidden; }
        .col-header { padding: 10px 15px; background: #1c2128; border-bottom: 1px solid var(--color-border); display: flex; align-items: center; height: 45px; box-sizing: border-box; }
        .col-header h3 { margin: 0; font-size: 12px; color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: 1px; }

        .editor-wrapper { display: flex; flex: 1; overflow: hidden; background: var(--color-bg); }
        .line-numbers { width: 40px; padding: 10px 0; text-align: center; background: var(--color-card); color: var(--color-line-nums); border-right: 1px solid var(--color-border); font-family: monospace; font-size: 13px; line-height: 20px; user-select: none; }
        textarea { flex: 1; border: none; padding: 10px; background: transparent; color: var(--color-fg-default); font-family: monospace; font-size: 13px; line-height: 20px; resize: none; outline: none; overflow: auto; white-space: pre; }

        .search-box { padding: 8px 15px; background: var(--color-card); border-bottom: 1px solid var(--color-border); }
        .search-input { width: 100%; background: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-fg-default); border-radius: 4px; padding: 6px 10px; font-size: 13px; box-sizing: border-box; }

        .col-footer { padding: 10px; background: var(--color-card); border-top: 1px solid var(--color-border); display: grid; gap: 8px; grid-template-columns: repeat(2, 1fr); }
        .quad-footer { grid-template-columns: repeat(4, 1fr); }

        .btn { background: var(--color-btn-bg); color: var(--color-fg-muted); border: 1px solid var(--color-border); border-radius: 6px; padding: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.active { color: var(--color-fg-default); opacity: 1; }
        .btn-green.active { background: #238636; color: white; border: none; }
        .btn-blue.active { background: #1f6feb; color: white; border: none; }
        .btn-red.active:hover { background: #da3633; color: white; }

        #status { padding: 6px 15px; font-size: 12px; color: var(--color-fg-muted); background: var(--color-card); border-top: 1px solid var(--color-border); height: 30px; }

        @media (max-width: 900px) {
            .container { flex-direction: column; overflow-y: auto; }
            .column { min-height: 400px; flex: none; }
            .quad-footer { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="lang-panel">
        <button class="lang-btn active" onclick="setLang('ru')" id="btn-ru"><img src="https://flagcdn.com/w40/ru.png" alt="RU"></button>
        <button class="lang-btn" onclick="setLang('en')" id="btn-en"><img src="https://flagcdn.com/w40/gb.png" alt="EN"></button>
    </div>

    <h2 id="main-title">V2Ray GeoLab</h2>

    <div class="container">
        <!-- ВВОД -->
        <div class="column">
            <div class="col-header"><h3 id="label-input">Ввод ссылок</h3></div>
            <div class="editor-wrapper">
                <div id="inputLineNums" class="line-numbers">1</div>
                <textarea id="inputLinks" oninput="onInputLinks()" onscroll="syncScroll('input')" placeholder="Paste vmess/vless/ss links here..."></textarea>
            </div>
            <div class="col-footer">
                <button id="runBtn" class="btn btn-green" onclick="processLinks()" disabled>Обработать</button>
                <button id="clrInputBtn" class="btn btn-red" onclick="clearInput()" disabled>Очистить</button>
            </div>
            <div id="status">> <span id="statusText">Готов</span></div>
        </div>

        <!-- ВЫВОД -->
        <div class="column">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" oninput="filterResults()" placeholder="Поиск по стране...">
            </div>
            <div class="editor-wrapper">
                <div id="outputLineNums" class="line-numbers">1</div>
                <textarea id="outputLinks" readonly onscroll="syncScroll('output')"></textarea>
            </div>
            <div class="col-footer quad-footer">
                <button class="btn" id="btn-copy" onclick="copyOutput()" disabled><span id="text-copy">Копировать</span></button>
                <button class="btn btn-blue" id="btn-retry" onclick="retryUnknown()" disabled>Retry</button>
                <button class="btn btn-blue" id="btn-dl" onclick="downloadTxt()" disabled>TXT</button>
                <button class="btn btn-red" id="btn-clr" onclick="clearOutput()" disabled>Удалить всё</button>
            </div>
        </div>
    </div>

<script>
    const i18n = {
        ru: { title: "V2Ray GeoLab", input: "Ввод ссылок", run: "Обработать", copy: "Копировать", copied: "Готово!", ready: "Готов", done: "Завершено", search: "Поиск по стране..." },
        en: { title: "V2Ray GeoLab", input: "Input Links", run: "Process", copy: "Copy", copied: "Copied!", ready: "Ready", done: "Done", search: "Search country..." }
    };

    let currentLang = 'ru';
    let fullResults = [];
    let geoCache = {};

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
        document.getElementById('main-title').innerText = i18n[lang].title;
        document.getElementById('label-input').innerText = i18n[lang].input;
        document.getElementById('runBtn').innerText = i18n[lang].run;
        document.getElementById('searchInput').placeholder = i18n[lang].search;
        if (document.getElementById('statusText').innerText.match(/Готов|Ready/)) document.getElementById('statusText').innerText = i18n[lang].ready;
    }

    function syncScroll(type) {
        document.getElementById(type + 'LineNums').scrollTop = document.getElementById(type + 'Links').scrollTop;
    }

    function updateLineNumbers(type) {
        const lines = document.getElementById(type + 'Links').value.split('\n').length;
        document.getElementById(type + 'LineNums').innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
    }

    function onInputLinks() {
        updateLineNumbers('input');
        const hasText = document.getElementById('inputLinks').value.trim().length > 0;
        ['runBtn', 'clrInputBtn'].forEach(id => {
            const el = document.getElementById(id);
            el.disabled = !hasText;
            if (hasText) el.classList.add('active'); else el.classList.remove('active');
        });
    }

    function getIP(link) {
        try {
            let base = link.split('#')[0].trim();
            if (base.startsWith('vmess://')) {
                let str = base.replace('vmess://', '').replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4 !== 0) str += '=';
                return JSON.parse(atob(str)).add;
            }
            const hostPart = base.split('://')[1].split('@')[1] || base.split('://')[1];
            return hostPart.split(':')[0].split('?')[0].split('/')[0];
        } catch (e) { return null; }
    }

    // ИСПОЛЬЗУЕМ IPWHO.IS — ОН РАЗРЕШАЕТ CORS ДЛЯ GITHUB PAGES
    async function fetchCountry(ip) {
        if (!ip || ip.match(/^(127\.|0\.|192\.168\.|10\.)/)) return "Internal/Invalid";
        if (geoCache[ip]) return geoCache[ip];

        try {
            const response = await fetch(`https://ipwho.is/${ip}`);
            if (response.ok) {
                const data = await response.json();
                const country = data.success ? data.country : "Unknown";
                geoCache[ip] = country;
                return country;
            }
            return response.status === 429 ? "RateLimit" : "Error";
        } catch (e) { return "CORS_Error"; }
    }

    async function processLinks() {
        const lines = document.getElementById('inputLinks').value.split('\n').filter(l => l.trim() !== "");
        const status = document.getElementById('statusText');
        const runBtn = document.getElementById('runBtn');
        
        runBtn.disabled = true;
        fullResults = [];
        document.getElementById('outputLinks').value = "";

        for (let i = 0; i < lines.length; i++) {
            status.innerText = `${i18n[currentLang].run} ${i+1}/${lines.length}`;
            const ip = getIP(lines[i]);
            const country = await fetchCountry(ip);
            
            fullResults.push(`${lines[i].split('#')[0]}#${country}`);
            renderResults(fullResults);
            
            // Если IP новый, ждем 1.2 сек, чтобы не поймать 429 (Rate Limit)
            if (!geoCache[ip] || country === "RateLimit") await new Promise(r => setTimeout(r, 1200));
        }

        status.innerText = i18n[currentLang].done;
        runBtn.disabled = false;
        updateButtonState();
    }

    async function retryUnknown() {
        const status = document.getElementById('statusText');
        for (let i = 0; i < fullResults.length; i++) {
            if (fullResults[i].match(/RateLimit|Error|CORS/)) {
                status.innerText = `Retry...`;
                const base = fullResults[i].split('#')[0];
                const country = await fetchCountry(getIP(base));
                if (!country.match(/RateLimit|Error|CORS/)) {
                    fullResults[i] = `${base}#${country}`;
                    renderResults(fullResults);
                }
                await new Promise(r => setTimeout(r, 1300));
            }
        }
        status.innerText = i18n[currentLang].done;
    }

    function renderResults(arr) {
        document.getElementById('outputLinks').value = arr.join('\n');
        updateLineNumbers('output');
        updateButtonState();
    }

    function filterResults() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.getElementById('outputLinks').value = fullResults.filter(l => l.toLowerCase().includes(q)).join('\n');
        updateLineNumbers('output');
    }

    function updateButtonState() {
        const hasText = document.getElementById('outputLinks').value.length > 0;
        ['btn-copy', 'btn-dl', 'btn-clr'].forEach(id => {
            const el = document.getElementById(id);
            el.disabled = !hasText;
            if (hasText) el.classList.add('active'); else el.classList.remove('active');
        });
        const hasErr = fullResults.some(l => l.match(/RateLimit|Error|CORS/));
        document.getElementById('btn-retry').disabled = !hasErr;
        if (hasErr) document.getElementById('btn-retry').classList.add('active');
    }

    function clearInput() { document.getElementById('inputLinks').value = ""; onInputLinks(); }
    function clearOutput() { fullResults = []; renderResults([]); }
    
    function copyOutput() { 
        navigator.clipboard.writeText(document.getElementById('outputLinks').value);
        const t = document.getElementById('text-copy');
        t.innerText = i18n[currentLang].copied;
        setTimeout(() => t.innerText = i18n[currentLang].copy, 2000);
    }

    function downloadTxt() {
        const blob = new Blob([document.getElementById('outputLinks').value], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "configs.txt"; a.click();
    }

    setLang('ru');
</script>
</body>
</html>
