<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2Ray GeoLab Pro</title>
    <style>
        :root {
            --color-bg: #0d1117;
            --color-card: #161b22;
            --color-border: #30363d;
            --color-fg-default: #c9d1d9;
            --color-fg-muted: #6e7681;
            --color-accent: #238636;
            --color-blue: #58a6ff;
            --color-line-nums: #484f58;
            --color-btn-bg: #21262d;
            --color-btn-blue: #1f6feb;
            --color-btn-red: #da3633;
        }

        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            background-color: var(--color-bg); color: var(--color-fg-default); 
            display: flex; flex-direction: column; padding: 25px; box-sizing: border-box; 
        }

        .lang-panel { position: absolute; top: 32px; right: 25px; display: flex; gap: 10px; z-index: 100; }
        .lang-btn { 
            background: transparent; border: 2px solid transparent; padding: 2px; 
            cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center;
        }
        .lang-btn img { width: 30px; height: auto; display: block; border-radius: 2px; }
        .lang-btn.active { border-color: var(--color-blue); }

        h2 { 
            color: #f0f6fc; font-size: 28px; font-weight: 600; margin: 0 0 25px 0; 
            text-align: center; letter-spacing: -0.5px; flex-shrink: 0; 
        }
        
        .container { 
            display: flex; gap: 15px; max-width: 1600px; margin: 0 auto; width: 100%; 
            flex-grow: 1; min-height: 0; height: 82vh; 
        }
        
        .column { 
            flex: 1; display: flex; flex-direction: column; 
            background: var(--color-card); border-radius: 6px; 
            border: 1px solid var(--color-border); min-width: 0; overflow: hidden;
        }

        .col-header { 
            padding: 10px 15px; background-color: #161b22; 
            border-bottom: 1px solid var(--color-border); 
            display: flex; align-items: center; justify-content: space-between;
            height: 50px; box-sizing: border-box;
        }
        .col-header h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: 1px; }

        .editor-wrapper { display: flex; flex: 1; overflow: hidden; background-color: var(--color-bg); }

        .line-numbers {
            width: 45px; padding: 12px 0; text-align: center;
            background: var(--color-card); color: var(--color-line-nums);
            border-right: 1px solid var(--color-border); user-select: none;
            overflow: hidden; font-family: ui-monospace, monospace; 
            font-size: 14px; line-height: 22px; 
        }

        textarea { 
            flex: 1; border: none; padding: 12px; background: transparent; color: var(--color-fg-default); 
            font-family: ui-monospace, SFMono-Regular, monospace; 
            font-size: 14px; line-height: 22px; 
            resize: none; outline: none; overflow: auto; white-space: pre;
        }

        .search-box { padding: 10px 15px; background: var(--color-card); border-bottom: 1px solid var(--color-border); display: flex; gap: 8px; }
        .search-input {
            flex: 1; background: var(--color-bg); border: 1px solid var(--color-border);
            color: var(--color-fg-default); border-radius: 6px; padding: 6px 12px; font-size: 14px; outline: none; height: 34px;
        }

        .col-footer { padding: 12px 15px; background-color: var(--color-card); border-top: 1px solid var(--color-border); display: grid; gap: 12px; }
        .col-footer.dual-button { grid-template-columns: 1fr 1fr; }
        .col-footer.quad-button { grid-template-columns: repeat(2, 1fr); }

        .btn-vmerge {
            background-color: var(--color-btn-bg);
            color: var(--color-fg-muted);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            text-decoration: none;
            transition: all 0.2s ease;
            opacity: 0.5;
        }

        .btn-vmerge.active { color: var(--color-fg-default); cursor: pointer; opacity: 1; }
        .btn-vmerge.active:hover { background-color: #30363d; border-color: #8b949e; }
        .btn-vmerge.active.btn-green { background-color: #238636; color: #fff; border-color: rgba(240,246,252,0.1); }
        .btn-vmerge.active.btn-blue { background-color: #1f6feb; color: #fff; border-color: rgba(240,246,252,0.1); }
        .btn-vmerge.active.btn-red { color: #f85149; }
        .btn-vmerge.active.btn-red:hover { background-color: #da3633; color: #fff; }

        #status { padding: 8px 15px; font-size: 13px; color: var(--color-fg-muted); background: var(--color-card); border-top: 1px solid var(--color-border); height: 35px; box-sizing: border-box; }

        @media (max-width: 1100px) {
            body { overflow-y: auto; height: auto; padding-top: 80px; }
            .container { flex-direction: column; height: auto; }
            .column { height: 500px; flex: none; }
            .col-footer.quad-button { grid-template-columns: 1fr; }
        }
        @media (min-width: 1101px) {
            .col-footer.quad-button { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div class="lang-panel">
        <button class="lang-btn active" onclick="setLang('ru')" id="btn-ru"><img src="https://flagpedia.net/data/flags/h80/ru.png" alt="RU"></button>
        <button class="lang-btn" onclick="setLang('en')" id="btn-en"><img src="https://flagpedia.net/data/flags/h80/gb.png" alt="EN"></button>
    </div>

    <h2 id="main-title">V2Ray GeoLab</h2>

    <div class="container">
        <div class="column">
            <div class="col-header">
                <h3 id="label-input">Ввод ссылок</h3>
            </div>
            <div class="editor-wrapper">
                <div id="inputLineNums" class="line-numbers">1</div>
                <textarea id="inputLinks" oninput="onInputLinks()" onscroll="syncScroll('input')"></textarea>
            </div>
            <div class="col-footer dual-button">
                <button id="runBtn" class="btn-vmerge btn-green" onclick="processLinks()" disabled>Запустить обработку</button>
                <button id="clrInputBtn" class="btn-vmerge btn-red" onclick="clearInput()" disabled><span id="text-clear-input">Очистить</span></button>
            </div>
            <div id="status">> <span id="statusText">Готов к работе</span></div>
        </div>

        <div class="column">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" oninput="filterResults()">
            </div>
            <div class="editor-wrapper">
                <div id="outputLineNums" class="line-numbers">1</div>
                <textarea id="outputLinks" readonly onscroll="syncScroll('output')"></textarea>
            </div>
            <div class="col-footer quad-button">
                <button class="btn-vmerge" id="btn-copy" onclick="copyOutput()" disabled><span id="text-copy">Копировать</span></button>
                <button class="btn-vmerge btn-blue" id="btn-retry" onclick="retryUnknown()" disabled><span id="text-retry">Retry Unknown</span></button>
                <button class="btn-vmerge btn-blue" id="btn-dl" onclick="downloadTxt()" disabled><span id="text-download">Скачать TXT</span></button>
                <button class="btn-vmerge btn-red" id="btn-clr" onclick="clearOutput()" disabled><span id="text-clear">Очистить всё</span></button>
            </div>
        </div>
    </div>

<script>
    const i18n = {
        ru: { title: "V2Ray GeoLab", inputLabel: "Ввод ссылок", runBtn: "Запустить обработку", processing: "Обработка...", copy: "Копировать", download: "Скачать TXT", clear: "Очистить всё", clearInput: "Очистить", retry: "Допроверить", copied: "Скопировано!", done: "Завершено!", ready: "Готов к работе", searchPlaceholder: "Поиск по результатам..." },
        en: { title: "V2Ray GeoLab", inputLabel: "Input Links", runBtn: "Run Process", processing: "Processing...", copy: "Copy", download: "Download TXT", clear: "Clear All", clearInput: "Clear", retry: "Retry Unknown", copied: "Copied!", done: "Done!", ready: "Ready", searchPlaceholder: "Search results..." }
    };

    let currentLang = 'ru';
    let fullResults = [];
    let geoCache = {}; // Кэш для экономии запросов

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
        document.getElementById('main-title').innerText = i18n[lang].title;
        document.getElementById('label-input').innerText = i18n[lang].inputLabel;
        document.getElementById('runBtn').innerText = i18n[lang].runBtn;
        document.getElementById('text-copy').innerText = i18n[lang].copy;
        document.getElementById('text-download').innerText = i18n[lang].download;
        document.getElementById('text-clear').innerText = i18n[lang].clear;
        document.getElementById('text-clear-input').innerText = i18n[lang].clearInput;
        document.getElementById('text-retry').innerText = i18n[lang].retry;
        document.getElementById('searchInput').placeholder = i18n[lang].searchPlaceholder;
        if (document.getElementById('statusText').innerText.match(/Готов|Ready/)) document.getElementById('statusText').innerText = i18n[lang].ready;
    }

    function syncScroll(type) {
        const area = document.getElementById(type + 'Links');
        const nums = document.getElementById(type + 'LineNums');
        nums.scrollTop = area.scrollTop;
    }

    function updateLineNumbers(type) {
        const area = document.getElementById(type + 'Links');
        const nums = document.getElementById(type + 'LineNums');
        const lines = area.value.split('\n').length;
        nums.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
    }

    function onInputLinks() {
        updateLineNumbers('input');
        const hasText = document.getElementById('inputLinks').value.trim().length > 0;
        ['runBtn', 'clrInputBtn'].forEach(id => {
            const el = document.getElementById(id);
            el.disabled = !hasText;
            hasText ? el.classList.add('active') : el.classList.remove('active');
        });
    }

    function clearInput() {
        document.getElementById('inputLinks').value = "";
        onInputLinks();
    }

    function getIP(link) {
        try {
            let base = link.split('#')[0].trim();
            if (base.startsWith('vmess://')) {
                let str = base.replace('vmess://', '').replace(/-/g, '+').replace(/_/g, '/');
                while (str.length % 4 !== 0) str += '=';
                return JSON.parse(atob(str)).add;
            }
            const urlPart = base.split('://')[1];
            const hostPart = urlPart.split('@')[1] || urlPart;
            return hostPart.split(':')[0].split('?')[0].split('/')[0];
        } catch (e) { return null; }
    }

    async function fetchCountry(ip) {
        if (!ip || ip.match(/^(127\.|0\.|192\.168\.)/)) return "Local/Invalid";
        if (geoCache[ip]) return geoCache[ip]; // Берем из кэша

        try {
            // Используем альтернативный API, если первый выдал 429
            const response = await fetch(`https://ipapi.co/${ip}/json/`);
            if (response.ok) {
                const data = await response.json();
                const result = data.country_name || "Unknown";
                geoCache[ip] = result;
                return result;
            }
            if (response.status === 429) return "RateLimited";
            return "Unknown";
        } catch (e) { 
            return "Error"; 
        }
    }

    async function processLinks() {
        const inputArea = document.getElementById('inputLinks');
        const btn = document.getElementById('runBtn');
        const status = document.getElementById('statusText');
        const lines = inputArea.value.split('\n').filter(l => l.trim() !== "");
        
        btn.disabled = true;
        btn.classList.remove('active');
        fullResults = [];
        document.getElementById('outputLinks').value = "";
        
        for (let i = 0; i < lines.length; i++) {
            status.innerText = `${i18n[currentLang].processing} ${i+1}/${lines.length}`;
            const ip = getIP(lines[i]);
            let country = await fetchCountry(ip);
            
            // Если получили лимит, ждем дольше и пробуем один раз перепроверить
            if (country === "RateLimited") {
                await new Promise(r => setTimeout(r, 2000));
                country = await fetchCountry(ip);
            }

            fullResults.push(`${lines[i].split('#')[0]}#${country}`);
            renderResults(fullResults);
            
            // Задержка 1.2 сек между запросами для предотвращения 429
            if (!geoCache[ip]) await new Promise(r => setTimeout(r, 1200));
        }

        status.innerText = i18n[currentLang].done;
        btn.disabled = false;
        btn.classList.add('active');
        updateButtonState();
    }

    async function retryUnknown() {
        const status = document.getElementById('statusText');
        document.getElementById('btn-retry').disabled = true;

        for (let i = 0; i < fullResults.length; i++) {
            if (fullResults[i].match(/RateLimited|Unknown|Error/)) {
                const base = fullResults[i].split('#')[0];
                status.innerText = `Retrying...`;
                const ip = getIP(base);
                const country = await fetchCountry(ip);
                if (!country.match(/RateLimited|Error/)) {
                    fullResults[i] = `${base}#${country}`;
                    renderResults(fullResults);
                }
                await new Promise(r => setTimeout(r, 1500));
            }
        }
        status.innerText = i18n[currentLang].done;
        updateButtonState();
    }

    function renderResults(arr) {
        document.getElementById('outputLinks').value = arr.join('\n');
        updateLineNumbers('output');
        updateButtonState();
    }

    function filterResults() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.getElementById('outputLinks').value = fullResults.filter(l => l.toLowerCase().includes(q)).join('\n');
        updateLineNumbers('output');
    }

    function updateButtonState() {
        const hasText = document.getElementById('outputLinks').value.length > 0;
        ['btn-copy', 'btn-dl', 'btn-clr'].forEach(id => {
            const el = document.getElementById(id);
            el.disabled = !hasText;
            hasText ? el.classList.add('active') : el.classList.remove('active');
        });
        const hasErr = fullResults.some(l => l.match(/RateLimited|Unknown|Error/));
        document.getElementById('btn-retry').disabled = !hasErr;
        hasErr ? document.getElementById('btn-retry').classList.add('active') : document.getElementById('btn-retry').classList.remove('active');
    }

    function clearOutput() { 
        fullResults = []; 
        document.getElementById('outputLinks').value = ""; 
        updateButtonState(); 
        updateLineNumbers('output');
    }
    
    function copyOutput() { 
        navigator.clipboard.writeText(document.getElementById('outputLinks').value);
        const t = document.getElementById('text-copy');
        const old = t.innerText; t.innerText = i18n[currentLang].copied;
        setTimeout(() => t.innerText = old, 2000);
    }

    function downloadTxt() {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([document.getElementById('outputLinks').value], {type: 'text/plain'}));
        a.download = "geo_configs.txt"; a.click();
    }

    setLang('ru');
</script>
</body>
</html>
